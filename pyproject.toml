[project]
name = "henry-fno-datagen"
version = "1.0.0"
description = "MODFLOW 6 data generation for FNO emulation of coupled Henry-type flow and transport problems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flopy==3.9.3",
    "numpy==1.26.3",
    "gstools>=1.7.0",
]

[dependency-groups]
notebook = [
    "matplotlib>=3.10.0",
    "ipykernel>=7.2.0",
]
